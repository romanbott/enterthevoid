[package]
name = "enterthevoid"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
libc = "0.2.184"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "kernel"
path = "src/bin/kernel.rs"

[[bin]]
name = "user_app"
path = "src/bin/user.rs"
